  reason: no-developer-program
  detail: >-
    Hydrow ships software only as an end-user product: contract discovery reached its two
    real production backends and found nothing published on either — every OpenAPI, Swagger,
    GraphQL, /.well-known/ and agent-card path on v2.api.prod.hydrow-external.net returns a
    genuine JSON 404 matching the control path, while v1.api.prod.hydrow-external.net answers
    a blanket 401 — and its developer-shaped hostnames (api./developer./docs.hydrow.com)
    exist only as a Vercel wildcard DNS record that never completes a TLS handshake.
  evidence:
