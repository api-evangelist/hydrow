aid: hydrow
name: Hydrow
description: >-
  Hydrow (legally True Rowing, Inc., Boston, Massachusetts) is a connected-fitness hardware
  company that makes the Hydrow indoor rowing machine and the LYQUID strength-training
  platform, sold with a subscription to a library of live and on-demand athlete-led workouts
  filmed on real water. Members interact with Hydrow through its rower touchscreens and the
  Hydrow iOS/Android companion apps, which sync workout summaries outward to Strava and Apple
  Health. Hydrow operates a real production backend for those apps, but publishes no public
  developer program, no API reference, no OpenAPI or other machine-readable contract, and no
  first-party SDK in any package registry; its developer-facing subdomains do not resolve to a
  service. Its public machine-readable surface is limited to an Atlassian Statuspage.
