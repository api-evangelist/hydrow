note: >-
  Hydrow serves NO /.well-known/ document on any host it controls. Three distinct failure
  modes were observed and are recorded verbatim below, because they are different facts:
  (1) hydrow.com and shop.hydrow.com sit behind a Vercel edge policy that answers HTTP 429
  with a 33KB Astro HTML shell for EVERY path including the control path — a bot challenge,
  not a document, and not evidence the path is absent; (2) v2.api.prod.hydrow-external.net
  is a live NestJS service that answers a genuine JSON 404 with the same error envelope as
  the control path, which IS evidence of absence; (3) v1.api.prod.hydrow-external.net is an
  AWS API Gateway that answers a blanket 401 on every path including the control, so nothing
  anonymous can be established there at all. NO WellKnown and NO SecurityTxt pointer is
  emitted from this file — every probe missed, and a pointer would assert a surface Hydrow
  does not serve.
